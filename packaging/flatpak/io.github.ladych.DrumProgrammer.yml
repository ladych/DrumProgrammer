# Flatpak manifest (AP24). Builds the checked-out repository; the copy for Flathub is made from it with
# tools/make-flathub-manifest.sh, which replaces the source by the Git tag of a release.
#   flatpak-builder --user --install --force-clean build-flatpak packaging/flatpak/io.github.ladych.DrumProgrammer.yml
id: io.github.ladych.DrumProgrammer
runtime: org.freedesktop.Platform
runtime-version: '26.08'
sdk: org.freedesktop.Sdk
command: drumprogrammer
finish-args:
  # JUCE draws with X11 (XWayland on Wayland desktops).
  - --socket=x11
  - --share=ipc
  - --device=dri
  # Audio: ALSA through the PulseAudio/PipeWire plugin of the runtime, JACK through PipeWire. MIDI
  # controllers are read from the ALSA sequencer (/dev/snd/seq), which needs the devices.
  - --socket=pulseaudio
  - --filesystem=xdg-run/pipewire-0
  - --device=all
  # JUCE has no file chooser portal and falls back to its own file browser, so projects, samples,
  # backing tracks and MIDI files are opened and saved directly in the home folder.
  - --filesystem=home
modules:
  - name: drumprogrammer
    buildsystem: cmake-ninja
    config-opts:
      - -DCMAKE_BUILD_TYPE=Release
      - -DDRUMPROG_BUILD_TESTS=OFF
    sources:
      - type: dir
        path: ../..
        skip:
          - build
          - build-flatpak
          - .flatpak-builder
