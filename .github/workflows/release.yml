name: Release

# Release packages (AP11): an AppImage for Linux and an installer for Windows.
# A tag v<version> (e.g. v1.0.0) builds both and publishes them as a GitHub release; the version in
# CMakeLists.txt has to match the tag. Pull requests that change the packaging only build them, so they
# can be tried from the workflow's artifacts.

on:
  push:
    tags: ['v*']
  pull_request:
    paths:
      - .github/workflows/release.yml
      - packaging/**
      - tools/make-appimage.sh
      - resources/AppIcon/**
  workflow_dispatch:

permissions:
  contents: read

jobs:
  appimage:
    name: Linux AppImage
    # The oldest supported runner, so the AppImage runs on older distributions too (glibc 2.35).
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v5
        with:
          submodules: recursive
      - name: Install dependencies
        run: >-
          sudo apt-get update && sudo apt-get install -y ninja-build g++-12 libfuse2
          libasound2-dev libjack-jackd2-dev libfreetype-dev libfontconfig1-dev
          libx11-dev libxcomposite-dev libxcursor-dev libxext-dev libxinerama-dev
          libxrandr-dev libxrender-dev libgl1-mesa-dev
      - name: Configure
        run: cmake -S . -B build -G Ninja -DCMAKE_BUILD_TYPE=Release -DDRUMPROG_BUILD_TESTS=OFF
        env:
          CC: gcc-12
          CXX: g++-12
      - name: Build
        run: cmake --build build
      - name: Pack AppImage
        run: tools/make-appimage.sh build dist
      - uses: actions/upload-artifact@v4
        with:
          name: DrumProgrammer-Linux-AppImage
          path: dist/*.AppImage

  windows-installer:
    name: Windows installer
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v5
        with:
          submodules: recursive
      # CMake downloads the ASIO SDK (GPLv3) from Steinberg, see cmake/DrumProgrammerJuce.cmake.
      - name: Configure
        run: cmake -S . -B build -A x64 -DDRUMPROG_BUILD_TESTS=OFF
      - name: Build
        run: cmake --build build --config Release --parallel
      - name: Install Inno Setup
        shell: pwsh
        run: |
          if (-not (Test-Path "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe")) { choco install innosetup -y --no-progress }
      - name: Build installer
        shell: pwsh
        run: |
          $version = (Select-String -Path CMakeLists.txt -Pattern 'project\(DrumProgrammer VERSION ([0-9.]+)').Matches[0].Groups[1].Value
          & "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe" "/DAppVersion=$version" "/DBuildDir=$PWD\build" "/DOutputDir=$PWD\dist" packaging\windows\DrumProgrammer.iss
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - uses: actions/upload-artifact@v4
        with:
          name: DrumProgrammer-Windows-Installer
          path: dist/*.exe

  publish:
    name: GitHub release
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [appimage, windows-installer]
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v5
      - name: Check the version
        run: |
          version="$(sed -n 's/^project(DrumProgrammer VERSION \([0-9.]*\).*/\1/p' CMakeLists.txt)"
          if [[ "v$version" != "$GITHUB_REF_NAME" ]]; then
            echo "tag $GITHUB_REF_NAME does not match version $version in CMakeLists.txt" >&2
            exit 1
          fi
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true
      - name: Publish
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" dist/* --title "Drum Programmer ${GITHUB_REF_NAME#v}" --generate-notes
